<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dev Jargon 5 — daily developer pronunciation challenge</title>
  <meta name="description" content="Five developer words a day, same for everyone. Listen, pick the right respelling, share your emoji grid. kubectl, nginx, GIF — can you say them?">
  <link rel="canonical" href="https://pronounce.renlab.ai/daily">
  <meta property="og:title" content="Dev Jargon 5 — how many dev words can you actually say?">
  <meta property="og:description" content="Five words a day. Same five for everyone. Listen and pick the right respelling.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://pronounce.renlab.ai/daily">
  <meta property="og:image" content="https://pronounce.renlab.ai/og-daily.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Dev Jargon 5 — daily dev pronunciation challenge">
  <meta name="twitter:description" content="Five words a day. Same five for everyone.">
  <meta name="twitter:image" content="https://pronounce.renlab.ai/og-daily.png">
  <meta name="theme-color" content="#ff6a3d">
  <link rel="icon" type="image/png" sizes="32" href="/favicon-32.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/style.css">
  <style>
    .j5-shell { max-width: 720px; margin: 0 auto; padding: 48px 24px 96px; }
    .j5-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 32px 28px; margin-bottom: 24px; }
    .j5-date { color: var(--muted); font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }
    .j5-word { font-family: var(--mono); font-size: 46px; letter-spacing: -0.01em; margin: 10px 0 4px; }
    .j5-cat { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
    .j5-play { background: var(--accent); color: var(--bg); border: none; padding: 12px 22px; border-radius: 999px; font-weight: 700; cursor: pointer; font-size: 16px; }
    .j5-play:hover { filter: brightness(1.08); }
    .j5-options { display: grid; gap: 10px; margin-top: 18px; }
    .j5-opt { background: var(--card-2); border: 1px solid var(--border); color: var(--fg); text-align: left; padding: 14px 18px; border-radius: 10px; cursor: pointer; font-family: var(--mono); font-size: 17px; transition: all 0.12s; }
    .j5-opt:hover:not(.locked) { border-color: var(--accent); transform: translateX(2px); }
    .j5-opt.correct { background: rgba(122,223,187,0.18); border-color: var(--accent-2); color: var(--accent-2); }
    .j5-opt.wrong { background: rgba(255,106,61,0.15); border-color: var(--accent); color: var(--accent); }
    .j5-opt.locked { cursor: default; }
    .j5-feedback { margin-top: 18px; padding: 14px 18px; border-radius: 10px; background: var(--card-2); border: 1px solid var(--border); font-size: 14.5px; color: var(--muted-strong); display: none; }
    .j5-feedback.shown { display: block; }
    .j5-feedback .src a { color: var(--link); }
    .j5-next { background: var(--accent); border: none; color: var(--bg); padding: 12px 28px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 15px; margin-top: 18px; }
    .j5-next:hover { filter: brightness(1.08); }
    .j5-grid { font-size: 34px; letter-spacing: 4px; margin: 14px 0 6px; font-family: var(--mono); }
    .j5-score { font-size: 20px; color: var(--accent-2); font-family: var(--mono); }
    .j5-share { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 18px; }
    .j5-share .btn, .j5-star { background: var(--accent); color: var(--bg); padding: 12px 22px; border-radius: 8px; font-weight: 700; text-decoration: none; border: none; cursor: pointer; font-size: 15px; }
    .j5-star { background: var(--accent-2); display: inline-block; }
    .j5-review { text-align: left; margin-top: 22px; border-top: 1px solid var(--border); padding-top: 16px; }
    .j5-review .row { padding: 8px 0; font-size: 15px; }
    .j5-review .r { font-family: var(--mono); color: var(--accent-2); }
    .j5-review a { color: var(--link); }
    .j5-mark { font-family: var(--mono); }
  </style>
</head>
<body>
  <div class="gh-banner">⭐ <a href="https://github.com/anzy-renlab-ai/pronounce">Star on GitHub</a> — community-curated dev pronunciation dictionary</div>
  <main class="j5-shell">
    <div id="app">
      <div class="j5-card" style="text-align: center;">
        <div class="j5-date" id="j5-date">—</div>
        <h1 style="font-size: 34px; margin: 10px 0 6px;">Dev Jargon 5</h1>
        <p style="color: var(--muted-strong); margin: 0 0 22px;">Five words. Same five for everyone today. Listen, pick the right respelling.</p>
        <button class="j5-play" id="j5-start">▶ Play</button>
        <p id="j5-streak" style="display: none; margin: 14px 0 0; font-weight: 700; color: var(--accent);"></p>
        <p style="margin-top: 20px; font-size: 13.5px; color: var(--muted);"><a href="/daily/archive" style="color: var(--link);">Word-of-the-day archive →</a></p>
      </div>
    </div>
  </main>
  <footer class="footer"><p>Pronounce · MIT · <a href="/browse">browse all entries</a> · <a href="/quiz">endless quiz</a></p></footer>
  <script src="/script.js"></script>
  <script src="/daily/game.js"></script>
  <script>
  (function () {
    if (typeof ENTRIES === "undefined" || typeof DailyGame === "undefined") return;
    var app = document.getElementById("app");
    var dateEl = document.getElementById("j5-date");
    var date = DailyGame.todayISO();
    dateEl.textContent = date + " · same five for everyone";
    var qs = DailyGame.buildQuestions(DailyGame.pickFive(ENTRIES, date), ENTRIES, date);
    var idx = 0, marks = [];

    // Consecutive-day streak, stored locally as {"last":"YYYY-MM-DD","n":N}.
    var STREAK_KEY = "j5-streak";
    function readStreak() {
      try { return JSON.parse(localStorage.getItem(STREAK_KEY) || "null"); }
      catch (e) { return null; }
    }
    var s0 = readStreak();
    var streakEl = document.getElementById("j5-streak");
    if (s0 && s0.n >= 2 && (s0.last === date || s0.last === DailyGame.prevDayISO(date))) {
      streakEl.textContent = s0.last === date
        ? "✅ " + s0.n + "-day streak — played today, back tomorrow"
        : "🔥 " + s0.n + "-day streak — keep it alive";
      streakEl.style.display = "block";
    }

    document.getElementById("j5-start").addEventListener("click", function () { renderQ(); });

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    function renderQ() {
      var q = qs[idx];
      app.innerHTML =
        '<div class="j5-card">' +
        '<div class="j5-date">Question ' + (idx + 1) + ' of 5</div>' +
        '<div class="j5-word">' + esc(q.w) + '</div>' +
        '<div class="j5-cat">' + esc(q.cat) + '</div>' +
        '<button class="j5-play" id="j5-audio">🔊 Hear it</button>' +
        '<div class="j5-options">' +
        q.options.map(function (o, i) {
          return '<button class="j5-opt" data-i="' + i + '">' + esc(o) + "</button>";
        }).join("") +
        "</div>" +
        '<div class="j5-feedback" id="j5-fb"></div>' +
        "</div>";
      document.getElementById("j5-audio").addEventListener("click", function () {
        if (typeof playEntry === "function") playEntry(q.w);
      });
      Array.prototype.forEach.call(app.querySelectorAll(".j5-opt"), function (btn) {
        btn.addEventListener("click", function () { answer(parseInt(btn.dataset.i, 10), btn); });
      });
    }

    function answer(i, btn) {
      var q = qs[idx];
      var opts = app.querySelectorAll(".j5-opt");
      if (opts.length && opts[0].classList.contains("locked")) return; // already answered
      Array.prototype.forEach.call(opts, function (b) { b.classList.add("locked"); });
      var right = i === q.answer;
      opts[q.answer].classList.add("correct");
      if (!right) btn.classList.add("wrong");
      marks.push(right);
      var fb = document.getElementById("j5-fb");
      fb.innerHTML =
        (right ? "🟩 Correct — " : "⬛ It's <strong>" + esc(q.options[q.answer]) + "</strong> — ") +
        '<span class="src">' + esc(q.ipa) + ' · <a href="/word/' + encodeURIComponent(q.slug) + '">' + esc(q.w) + " page →</a></span>" +
        (q.note ? '<div style="margin-top:8px; color: var(--muted);">' + esc(q.note) + "</div>" : "") +
        '<button class="j5-next" id="j5-next">' + (idx === 4 ? "See result →" : "Next →") + "</button>";
      fb.classList.add("shown");
      document.getElementById("j5-next").addEventListener("click", function () {
        idx += 1;
        if (idx < 5) renderQ(); else renderResult();
      });
    }

    function renderResult() {
      var score = marks.filter(Boolean).length;
      var grid = "🔊" + marks.map(function (m) { return m ? "🟩" : "⬛"; }).join("");
      var streak = DailyGame.nextStreak(readStreak(), date);
      try { localStorage.setItem(STREAK_KEY, JSON.stringify(streak)); } catch (e) {}
      var lines = [
        "Dev Jargon 5 · " + date,
        grid + " " + score + "/5"
      ];
      if (streak.n >= 2) lines.push("🔥 " + streak.n + "-day streak");
      lines.push("how many dev words can you say?");
      lines.push("https://pronounce.renlab.ai/daily");
      var share = lines.join("\n");
      var review = qs.map(function (q, i) {
        return '<div class="row">' + (marks[i] ? "🟩" : "⬛") + ' <a href="/word/' + encodeURIComponent(q.slug) + '">' + esc(q.w) + "</a> — <span class=\"r\">" + esc(q.options[q.answer]) + "</span></div>";
      }).join("");
      app.innerHTML =
        '<div class="j5-card" style="text-align: center;">' +
        '<div class="j5-date">' + date + "</div>" +
        '<div class="j5-grid">' + grid + "</div>" +
        '<div class="j5-score">' + score + " / 5</div>" +
        (streak.n >= 2 ? '<div style="margin-top: 6px; font-weight: 700; color: var(--accent);">🔥 ' + streak.n + "-day streak</div>" : "") +
        '<div class="j5-share">' +
        '<button class="btn" id="j5-copy">📋 Copy score</button>' +
        '<a class="j5-star" href="https://github.com/anzy-renlab-ai/pronounce">⭐ Star the dictionary</a>' +
        "</div>" +
        '<div class="j5-review">' + review + "</div>" +
        "</div>";
      document.getElementById("j5-copy").addEventListener("click", function () {
        copyToClipboard(share, "Score copied — paste it anywhere");
      });
    }
  })();
  </script>
</body>
</html>
