name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'bin/say-it'
      - 'data/pronunciations.tsv'
      - 'tools/build-site.sh'
      - '.github/workflows/ci.yml'
      - '.github/workflows/build-site.yml'
      - 'docs/v2/audio.jsx'
      - 'docs/v2/sections-1.jsx'
      - 'docs/v2/sections-2.jsx'
      - 'docs/v2/eggs.jsx'
      - 'docs/v2/app.jsx'
      - 'tools/build-v2-data.py'
      - 'tools/build-v2-bundle.sh'
      - 'tools/build-entry-dates.py'
      - 'tools/build-scoreboard.py'
      - 'tools/build-seo.py'
      - 'tools/make-audio-all.py'
      - 'tools/make-og.py'
      - 'tools/make-og-all.py'
      - 'tools/test-v2-audio.mjs'
      - 'tools/test_build_v2_data.py'
      - 'tools/test_make_og_all.py'
      - 'tools/lint-dict.sh'
      - 'tools/smoke-test.sh'
      - 'README.md'
      - 'CLAUDE.md'
      - 'DESIGN.md'
      - 'CONTRIBUTING.md'
      - 'integrations/codex/AGENTS.md'
      - 'docs/v2/index.html'
      - 'CHANGELOG.md'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Lint dictionary format
        run: bash tools/lint-dict.sh

  smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: CLI smoke test
        run: bash tools/smoke-test.sh

  release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Test homepage audio
        run: node --test tools/test-v2-audio.mjs
      - name: Test generated data and OG state
        run: python -m unittest tools/test_build_v2_data.py tools/test_make_og_all.py
