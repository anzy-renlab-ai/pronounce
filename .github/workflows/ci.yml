name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'bin/say-it'
      - 'data/pronunciations.tsv'
      - 'tools/build-site.sh'
      - '.github/workflows/ci.yml'
      - '.github/workflows/build-site.yml'
      - 'docs/v2/audio.jsx'
      - 'docs/v2/sections-1.jsx'
      - 'docs/v2/sections-2.jsx'
      - 'docs/v2/eggs.jsx'
      - 'docs/v2/app.jsx'
      - 'tools/build-v2-data.py'
      - 'tools/build-v2-bundle.sh'
      - 'tools/build-entry-dates.py'
      - 'tools/test_build_entry_dates.py'
      - 'tools/build-scoreboard.py'
      - 'tools/build-seo.py'
      - 'tools/test_build_seo.py'
      - 'tools/test_indexnow_submit.py'
      - 'tools/indexnow-submit.sh'
      - 'tools/make-audio-all.py'
      - 'tools/make-og.py'
      - 'tools/make-og-all.py'
      - 'tools/test-v2-audio.mjs'
      - 'tools/test_pronounce_action.mjs'
      - 'tools/build_source_sprint.py'
      - 'tools/test_source_sprint.py'
      - 'action.yml'
      - 'actions/pronounce-docs/**'
      - '.github/workflows/pronounce-docs.yml'
      - '.github/workflows/weekly-source-sprint.yml'
      - 'tools/test_build_v2_data.py'
      - 'tools/test_make_og_all.py'
      - 'tools/build-chrome-dict.py'
      - 'integrations/chrome/src/dictionary.json'
      - 'tools/test_chrome_dictionary.py'
      - 'tools/lint-dict.sh'
      - 'tools/smoke-test.sh'
      - '.github/workflows/indexnow.yml'
      - 'README.md'
      - 'CLAUDE.md'
      - 'DESIGN.md'
      - 'CONTRIBUTING.md'
      - 'integrations/codex/AGENTS.md'
      - 'docs/index.html'
      - 'docs/v2/index.html'
      - 'CHANGELOG.md'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint dictionary format
        run: bash tools/lint-dict.sh

  smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: CLI smoke test
        run: bash tools/smoke-test.sh

  release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Test homepage audio
        run: node --test tools/test-v2-audio.mjs tools/test_pronounce_action.mjs
      - name: Test generated data and OG state
        run: python -m unittest tools/test_build_v2_data.py tools/test_make_og_all.py tools/test_chrome_dictionary.py tools/test_build_entry_dates.py tools/test_build_seo.py tools/test_indexnow_submit.py tools/test_source_sprint.py
