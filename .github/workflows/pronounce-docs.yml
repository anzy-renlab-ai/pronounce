name: Pronounce Docs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.mdx'

permissions:
  contents: read

jobs:
  glossary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Build pronunciation glossary
        uses: ./
        with:
          max-results: '40'
